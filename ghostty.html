<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghostty cheat sheet</title>
    <meta
      name="description"
      content="Ghostty keyboard shortcuts — macOS defaults."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header class="masthead">
      <p class="eyebrow">Cheat sheet</p>
      <h1>Ghostty</h1>
      <p class="lede">
        Keyboard shortcuts for the Ghostty terminal, macOS defaults.
      </p>
    </header>

    <main>
      <!-- Add a section: copy this whole <section> block and swap the heading
           and rows. Add a shortcut: copy one <tr>. -->
      <section id="panels">
        <h2>Panels</h2>
        <table class="shortcuts">
          <caption>
            Panel shortcuts
          </caption>
          <thead class="visually-hidden">
            <tr>
              <th scope="col">Action</th>
              <th scope="col">Shortcut</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="action">Split right</td>
              <td class="keys"><kbd>Cmd</kbd> + <kbd>D</kbd></td>
            </tr>
            <tr>
              <td class="action">Split down</td>
              <td class="keys">
                <kbd>Cmd</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd>
              </td>
            </tr>
            <tr>
              <td class="action">Close panel</td>
              <td class="keys"><kbd>Cmd</kbd> + <kbd>W</kbd></td>
            </tr>
            <tr>
              <td class="action">Focus panel</td>
              <td class="keys">
                <kbd>Cmd</kbd> + <kbd>Opt</kbd> + <kbd>Arrows</kbd>
              </td>
            </tr>
            <tr>
              <td class="action">Resize panel</td>
              <td class="keys">
                <kbd>Cmd</kbd> + <kbd>Ctrl</kbd> + <kbd>Arrows</kbd>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer>
      <p>
        Defaults from the
        <a href="https://ghostty.org/docs/config/keybind">Ghostty keybind docs</a
        >.
      </p>
    </footer>
  </body>
</html>
